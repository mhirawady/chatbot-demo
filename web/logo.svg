<svg width="400" height="260" viewBox="0 0 400 260" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Side-profile bunny shaped like a plane, facing right, in soft blue tones, wearing WWI aviator goggles</title>
<desc>A bunny whose whole body forms an airplane silhouette facing right, rendered in soft shades of blue, with a fuselage-shaped body, a top wing, a small swept-back wing sliver on the body, a tail fin, landing gear wheels, a propeller, and a round WWI-style flight goggle</desc>

<!-- tail fin (fin + fluffy tail) -->
<polygon points="42,95 78,120 78,165 42,175" fill="#CEDFF6" stroke="#185FA5" stroke-width="1.5"/>
<circle cx="38" cy="140" r="15" fill="#CEDFF6" stroke="#185FA5" stroke-width="1.5"/>

<!-- landing gear struts + wheels -->
<line x1="140" y1="168" x2="140" y2="192" stroke="#0C447C" stroke-width="4"/>
<line x1="235" y1="168" x2="235" y2="192" stroke="#0C447C" stroke-width="4"/>
<circle cx="140" cy="205" r="14" fill="#042C53"/>
<circle cx="140" cy="205" r="5" fill="#378ADD"/>
<circle cx="235" cy="205" r="14" fill="#042C53"/>
<circle cx="235" cy="205" r="5" fill="#378ADD"/>

<!-- fuselage (body) -->
<rect x="72" y="108" width="235" height="58" rx="29" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.5"/>

<!-- small sliver wing, swept back along the lower body -->
<path d="M 175 158 Q 122 150 88 168 Q 96 180 135 178 Q 162 176 178 165 Z" fill="#E6F1FB" stroke="#85B7EB" stroke-width="1.5"/>
<path d="M 165 160 Q 128 158 98 170" fill="none" stroke="#85B7EB" stroke-width="1"/>

<!-- ear swept back like a pennant/fin along the top -->
<path d="M 295 108 Q 220 75 150 68 Q 145 78 150 86 Q 215 92 285 122 Z" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.5"/>
<path d="M 285 112 Q 220 84 158 78" fill="none" stroke="#85B7EB" stroke-width="5" stroke-linecap="round" opacity="0.7"/>

<!-- wing on top, swept, with strut down to body -->
<line x1="195" y1="80" x2="195" y2="112" stroke="#0C447C" stroke-width="4"/>
<path d="M 125 78 Q 190 22 262 60 Q 255 82 195 84 Q 155 85 125 78 Z" fill="#E6F1FB" stroke="#85B7EB" stroke-width="1.5"/>
<path d="M 140 74 Q 195 42 250 62" fill="none" stroke="#85B7EB" stroke-width="1"/>
<path d="M 145 80 Q 195 66 248 70" fill="none" stroke="#85B7EB" stroke-width="1"/>

<!-- head (nose of the plane) -->
<circle cx="312" cy="137" r="42" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.5"/>

<!-- blush -->
<ellipse cx="300" cy="158" rx="8" ry="5" fill="#85B7EB" opacity="0.5"/>

<!-- goggle strap around head -->
<path d="M 280 100 Q 312 88 340 102 L 338 112 Q 312 100 282 110 Z" fill="#0C447C" stroke="#042C53" stroke-width="1"/>

<!-- goggle (single lens, side profile) -->
<circle cx="304" cy="132" r="21" fill="#042C53"/>
<circle cx="304" cy="132" r="16" fill="#85B7EB" stroke="#042C53" stroke-width="1"/>
<circle cx="299" cy="126" r="4" fill="#FFFFFF" opacity="0.7"/>
<circle cx="306" cy="133" r="4.5" fill="#042C53"/>

<!-- muzzle / nose tip with teeth -->
<path d="M 350 140 Q 372 138 374 150 Q 372 162 350 160 Z" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.5"/>
<ellipse cx="368" cy="149" rx="4" ry="3" fill="#0C447C"/>
<rect x="352" y="158" width="5" height="8" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.5"/>
<rect x="358" y="158" width="5" height="8" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.5"/>

<!-- propeller at the very nose -->
<circle cx="380" cy="148" r="5" fill="#042C53"/>
<ellipse cx="380" cy="130" rx="4" ry="18" fill="#85B7EB" transform="rotate(15 380 148)"/>
<ellipse cx="380" cy="166" rx="4" ry="18" fill="#85B7EB" transform="rotate(15 380 148)"/>
</svg>
